apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mr-int-llc-ecom
  labels:
    app.kubernetes.io/name: mr-int-llc-ecom
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mr-int-llc-ecom
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mr-int-llc-ecom
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: wait-redis
          image: redis:7.2-alpine
          command:
            - sh
            - -c
            - until redis-cli -h redis ping | grep -q PONG; do sleep 2; done
      containers:
        - name: api
          image: mr-int-llc-ecom-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
            - name: socket
              containerPort: 5005
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mr-int-llc-ecom
  labels:
    app.kubernetes.io/name: mr-int-llc-ecom
    app.kubernetes.io/component: api
spec:
  type: NodePort
  externalIPs:
    - 103.186.20.117
  selector:
    app.kubernetes.io/name: mr-int-llc-ecom
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
    - name: http-direct
      port: 5000
      targetPort: http
      nodePort: 30500
    - name: socket
      port: 5005
      targetPort: socket
      nodePort: 30505
